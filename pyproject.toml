[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-journal-meta-analyzer"
version = "1.0.0"
description = "Automated Open-Access Journal Literature Search, PRISMA 2020 Flow Tracking & Quantitative/Qualitative Meta-Analysis Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "pandas>=2.2.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
ai = ["google-genai>=2.0.0"]
test = ["pytest>=8.0.0"]
